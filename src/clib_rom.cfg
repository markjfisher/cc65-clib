FEATURES {
    STARTADDRESS: default = $8000;
}
SYMBOLS {
}
MEMORY {
    ZP:        file = "", define = yes, start = $0050, size = $0020;
    # ROM header (language/service entry, type, title, copyright).
    # fill = yes pads each region to its full size in the output image so that
    # file offset == (memory address - $8000). Without this the linker packs
    # segments contiguously and the fixed $8100 jump table would land at the
    # wrong file offset (and thus the wrong address when the ROM is paged in).
    HEADER_M:  file = %O, define = yes, start = $8000, size = $0100, fill = yes;
    # Fixed-address jump table (vectoring layer). 3 bytes/slot, up to 256 slots.
    # Its base ($8100) and slot size are an ABI contract with clib_imports.py
    # and clib_stubs.py (BASE/SLOT_SIZE); do not move without updating those.
    JUMP_M:    file = %O, define = yes, start = $8100, size = $0300, fill = yes;
    # Everything else (relocatable code + rodata) lives above the table.
    MAIN:      file = %O, define = yes, start = $8400, size = $3C00;
}
SEGMENTS {
    HEADER:    load = HEADER_M, type = ro;
    JUMPTABLE: load = JUMP_M,   type = ro, optional = yes;
    CODE:      load = MAIN,     type = ro;
    RODATA:    load = MAIN,     type = ro;
    ZEROPAGE:  load = ZP,       type = zp;
}
